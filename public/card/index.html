<title>Pedro Pereira · Starmountain Flash</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: uma coluna estreita tipo telemóvel; cartão físico em 3D no topo, ações logo abaixo, depois oferta, trabalhos e formulário. Preto dominante com uma única fonte de luz esmeralda. */
:root{
  --base:#090A0A;
  --surface:#0F1211;
  --line:#1C2422;
  --em-900:#082D1E;
  --em-700:#0E4B35;
  --em-500:#106B54;
  --core:#00A870;
  --jade:#4FB78E;
  --cream:#E4DFD1;
  --muted:#8E9A94;
  --display:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--base)}
body{
  background:var(--base);color:var(--cream);
  font-family:var(--display);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.glow{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60vmax 45vmax at 50% -8%, color-mix(in srgb,var(--core) 38%,transparent), transparent 60%),
    radial-gradient(70vmax 60vmax at 50% -10%, var(--em-700), transparent 70%);
  opacity:.9;
  animation:bloom 1.6s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes bloom{from{opacity:0;transform:scale(.6)}to{opacity:.9;transform:none}}
.grid{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(color-mix(in srgb,var(--jade) 9%,transparent) 1px,transparent 1px),
    linear-gradient(90deg,color-mix(in srgb,var(--jade) 9%,transparent) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-mask-image:radial-gradient(80% 60% at 50% 20%,#000 30%,transparent 80%);
          mask-image:radial-gradient(80% 60% at 50% 20%,#000 30%,transparent 80%);
}
.boot{
  font:400 12px/1.7 var(--mono);color:var(--muted);letter-spacing:.02em;
  min-height:calc(1.7em * 3);
}
.boot .ok{color:var(--jade)}
.boot .cur{display:inline-block;width:.55em;height:1em;vertical-align:-2px;background:var(--jade);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.card-id{position:absolute;top:7%;right:7%;font:500 clamp(8px,2.4vw,10px) var(--mono);letter-spacing:.1em;color:color-mix(in srgb,var(--cream) 60%,transparent)}
section h2::before{content:"// ";color:var(--muted)}
.top-r{display:flex;align-items:center;gap:8px}
.qr-btn{
  display:flex;align-items:center;gap:6px;cursor:pointer;
  font:500 12px var(--mono);letter-spacing:.05em;color:var(--cream);
  background:color-mix(in srgb,var(--base) 70%,transparent);border:1px solid var(--line);border-radius:999px;padding:8px 12px;
}
.qr-btn:hover{border-color:var(--jade)}
.qr-btn svg{width:15px;height:15px;color:var(--jade)}
.qr-ov{
  position:fixed;inset:0;z-index:20;background:var(--base);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.qr-ov::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(50vmax 40vmax at 50% 45%, color-mix(in srgb,var(--core) 30%,transparent), transparent 70%)}
.qr-frame{
  position:relative;padding:18px;border-radius:20px;background:#fff;
  width:min(78vw,320px);aspect-ratio:1;display:grid;place-items:center;
  box-shadow:0 30px 80px -20px color-mix(in srgb,var(--core) 55%,transparent);
}
.qr-frame #qr,.qr-frame #qr img,.qr-frame #qr canvas{width:100%!important;height:auto!important;display:block}
.qr-cap{position:relative;text-align:center;display:flex;flex-direction:column;gap:4px}
.qr-cap strong{font:600 22px var(--display);letter-spacing:-.01em}
.qr-cap small{font:400 12px var(--mono);color:var(--muted);letter-spacing:.04em}
.qr-tabs{
  position:relative;display:flex;gap:8px;overflow-x:auto;max-width:min(100%,520px);
  padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.qr-tabs::-webkit-scrollbar{display:none}
.qr-tab{
  flex:none;cursor:pointer;font:500 13px var(--display);letter-spacing:0;
  color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;
}
.qr-tab[aria-selected="true"]{color:var(--base);background:var(--jade);border-color:var(--jade)}
.qr-close{position:relative;cursor:pointer;font:500 13px var(--mono);color:var(--cream);background:none;border:1px solid var(--line);border-radius:999px;padding:10px 20px}

.proto{
  position:relative;z-index:2;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--base);background:var(--jade);
  padding-block:6px;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}

.wrap{
  position:relative;z-index:1;
  max-width:440px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
  display:flex;flex-direction:column;gap:40px;
}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo-slot{
  height:32px;padding:0 12px;display:flex;align-items:center;
  border:1px dashed color-mix(in srgb,var(--jade) 60%,transparent);border-radius:6px;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--jade);text-transform:uppercase;
}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:color-mix(in srgb,var(--base) 70%,transparent)}
.lang button{
  font:500 12px var(--mono);color:var(--muted);background:none;border:0;
  padding:6px 12px;border-radius:999px;cursor:pointer;letter-spacing:.05em;
}
.lang button[aria-pressed="true"]{background:var(--cream);color:var(--base)}

/* cartão 3D */
.stage{perspective:1100px;display:flex;flex-direction:column;align-items:center;gap:14px}
.flip{position:relative;width:100%;aspect-ratio:1.586;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1);cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip.on{transform:rotateY(180deg)}
.flip .card{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.flip .back{transform:rotateY(180deg)!important;animation:none;
  background:radial-gradient(120% 120% at 20% 50%, var(--em-700), var(--em-900) 55%, var(--base) 100%);
  display:grid;grid-template-columns:minmax(0,50%) minmax(0,1fr);align-items:center;gap:5%;padding:5% 6%}
.qr-box{width:100%;aspect-ratio:1;max-width:100%;background:#fff;border-radius:10px;padding:7%;overflow:hidden;box-sizing:border-box}
.qr-box #qr{width:100%;height:100%}
.qr-box #qr img,.qr-box #qr canvas{width:100%!important;height:100%!important;max-width:100%;object-fit:contain;display:block}
.back-cap{display:flex;flex-direction:column;gap:6px;min-width:0}
.back-cap span{font:500 clamp(9px,2.4vw,11px) var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--jade)}
.back-cap strong{font:600 clamp(17px,5vw,22px)/1.15 var(--display);letter-spacing:-.02em;text-wrap:balance}
.back-cap small{font:400 clamp(10px,2.7vw,12px) var(--mono);color:color-mix(in srgb,var(--cream) 65%,transparent);word-break:break-all}
.stage .qr-tabs{justify-content:flex-start;width:100%}
.card{
  --rx:0deg;--ry:0deg;--mx:50%;--my:30%;
  position:relative;width:100%;aspect-ratio:1.586;max-width:100%;
  border-radius:18px;overflow:hidden;
  transform:rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform .25s ease-out;
  background:
    radial-gradient(120% 90% at var(--mx) var(--my), color-mix(in srgb,var(--core) 55%,transparent) 0%, var(--em-500) 22%, var(--em-700) 45%, var(--em-900) 68%, var(--base) 100%);
  box-shadow:
    0 1px 0 0 color-mix(in srgb,var(--cream) 18%,transparent) inset,
    0 30px 60px -20px color-mix(in srgb,var(--core) 35%,transparent),
    0 18px 40px -12px #000;
  animation:rise 1.1s .15s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(24px) rotateX(18deg)}to{opacity:1}}
.card::after{ /* brilho que segue o dedo */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(40% 50% at var(--mx) var(--my), color-mix(in srgb,var(--cream) 22%,transparent), transparent 70%);
  mix-blend-mode:soft-light;
}
.grain{position:absolute;inset:0;opacity:.18;pointer-events:none;mix-blend-mode:overlay}
.card-in{
  position:absolute;inset:0;padding:6% 7%;
  display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;gap:0 16px;
}
.photo{
  grid-row:1;align-self:start;
  width:clamp(64px,22vw,92px);aspect-ratio:1;border-radius:50%;
  border:1px dashed color-mix(in srgb,var(--cream) 55%,transparent);
  display:grid;place-items:center;text-align:center;
  font:500 9px/1.3 var(--mono);color:color-mix(in srgb,var(--cream) 75%,transparent);text-transform:uppercase;letter-spacing:.05em;
  background:color-mix(in srgb,var(--base) 25%,transparent);
}
.logo{height:30px;width:auto;display:block}
.photo{object-fit:cover;border:1.5px solid color-mix(in srgb,var(--cream) 35%,transparent)!important;box-shadow:0 8px 24px -8px #000}
.who{grid-row:1;align-self:start;min-width:0;padding-top:2px}
.who h1{margin:0;font-family:var(--display);font-weight:600;letter-spacing:-.035em;font-size:clamp(20px,6vw,27px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.who p{margin:6px 0 0;font-size:clamp(12px,3.4vw,14px);color:color-mix(in srgb,var(--cream) 82%,transparent);line-height:1.35}
.card-foot{
  grid-column:1/-1;grid-row:2;
  display:flex;justify-content:space-between;align-items:flex-end;gap:8px;
  font:400 clamp(9px,2.6vw,11px)/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;
  color:color-mix(in srgb,var(--cream) 70%,transparent);
}
.card-foot b{color:var(--cream);font-weight:500}
.hint{font:400 11px var(--mono);color:var(--muted);letter-spacing:.06em}

/* ações */
.actions{display:flex;flex-direction:column;gap:10px}
.btn-save{
  text-decoration:none;
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:17px 20px;border:0;border-radius:14px;cursor:pointer;
  font:600 16px var(--display);letter-spacing:-.01em;
  color:var(--base);background:var(--cream);
  transition:transform .15s ease, background .2s;
}
.btn-save:hover{background:#fff}
.btn-save:active{transform:scale(.98)}
.btn-save svg{width:20px;height:20px}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.link{
  display:flex;align-items:center;gap:12px;min-width:0;
  padding:14px;border-radius:12px;text-decoration:none;color:var(--cream);
  background:color-mix(in srgb,var(--surface) 85%,transparent);
  border:1px solid var(--line);
  transition:border-color .2s, transform .15s;
}
.link:hover{border-color:var(--em-500)}
.link:active{transform:scale(.98)}
.link svg{width:20px;height:20px;flex:none;color:var(--jade)}
.link span{display:flex;flex-direction:column;min-width:0}
.link small{font:400 10px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.link strong{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link.wide{grid-column:1/-1}
.copyrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.copy{
  font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;
  background:none;border:1px solid var(--line);color:var(--jade);border-radius:8px;padding:6px 10px;cursor:pointer;flex:none;
}

/* secções */
section h2{
  margin:0 0 14px;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--jade);
}
.offer{
  position:relative;border-radius:16px;padding:22px;overflow:hidden;
  background:linear-gradient(160deg,var(--em-900),var(--base) 75%);
  border:1px solid color-mix(in srgb,var(--em-500) 50%,transparent);
}
.offer h3{margin:0;font-weight:600;font-size:23px;line-height:1.15;letter-spacing:-.025em;text-wrap:balance}
.offer p{margin:10px 0 0;color:color-mix(in srgb,var(--cream) 78%,transparent);font-size:15px;max-width:34ch}

.work{display:flex;flex-direction:column;gap:10px}
.job{
  display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;
  padding:10px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);
}
.thumb{
  aspect-ratio:1;border-radius:8px;display:grid;place-items:center;
  font:500 8px/1.2 var(--mono);color:color-mix(in srgb,var(--cream) 60%,transparent);text-transform:uppercase;letter-spacing:.05em;text-align:center;
  border:1px dashed color-mix(in srgb,var(--cream) 30%,transparent);
}
img.thumb{width:100%;object-fit:cover;border:1px solid var(--line)}
.t1{background:radial-gradient(circle at 30% 30%,var(--em-500),var(--em-900))}
.t2{background:radial-gradient(circle at 70% 30%,var(--em-700),var(--base))}
.t3{background:radial-gradient(circle at 50% 80%,var(--em-500),var(--em-900))}
.job{text-decoration:none;color:var(--cream);transition:border-color .2s}
.job:hover{border-color:var(--em-500)}
.job div{min-width:0}
.job strong{display:block;font-weight:500;font-size:15px}
.job small{display:block;font:400 11px var(--mono);color:var(--muted);letter-spacing:.04em;margin-top:2px}

/* formulário */
form{display:flex;flex-direction:column;gap:10px}
.lead-intro{margin:0 0 6px;color:color-mix(in srgb,var(--cream) 78%,transparent);font-size:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{
  font:400 16px var(--display);color:var(--cream);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;
}
.field input:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px color-mix(in srgb,var(--jade) 25%,transparent)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.submit{
  margin-top:4px;padding:15px;border-radius:12px;border:1px solid var(--jade);cursor:pointer;
  font:600 16px var(--display);color:var(--base);background:var(--jade);
}
.submit:active{transform:scale(.98)}
.done{
  padding:18px;border-radius:12px;border:1px solid var(--jade);
  background:color-mix(in srgb,var(--jade) 10%,transparent);font-size:15px;
}

footer{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding-top:18px;border-top:1px solid var(--line);
  font:400 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;
}
footer a{color:var(--cream);text-decoration:none}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  z-index:10;max-width:calc(100% - 32px);
  background:var(--cream);color:var(--base);font:500 13px var(--display);
  padding:10px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
@media (max-width:360px){.row2{grid-template-columns:1fr}.links{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  .glow,.card{animation:none}
  .card{transition:none}
}
</style>
</head>
<body>

<div class="glow" aria-hidden="true"></div>
<div class="grid" aria-hidden="true"></div>

  <section>
    <h2 data-i="leadTag"></h2>
    <p class="lead-intro" data-i="leadIntro"></p>
    <form id="lead" novalidate>
      <p hidden><label>Não preencher <input name="website" tabindex="-1" autocomplete="off"></label></p>
      <div class="row2">
        <div class="field"><label for="f-name" data-i="fName"></label><input id="f-name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="f-company" data-i="fCompany"></label><input id="f-company" name="company" autocomplete="organization"></div>
      </div>
      <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="f-site" data-i="fSite"></label><input id="f-site" name="site" inputmode="url" placeholder="empresa.pt"></div>
      <button class="submit" type="submit" data-i="send"></button>
    </form>
    <div class="done" id="done" hidden data-i="done"></div>
  </section>

  <footer>
    <span>Starmountain Flash</span>
    <span>Web Summit 2026 · Lisboa</span>
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const T={
  en:{
    role:"Websites and AI automation for businesses",
    hint:"Tap the card for my QR codes",hintBack:"Tap the card to go back",scan:"Scan me",
    save:"Save my contact",
    copy:"Copy",copied:"Email copied",
    offerTag:"For people I meet at Web Summit",
    offerTitle:"A free visual proposal for your website",
    offerText:"I redesign your homepage and send it to you. No commitment. You decide afterwards if it's worth moving forward.",
    workTag:"Recent work",
    w1:"Landing page · trading community",
    w2:"Website · personal trainer",
    w3:"Websites · University of Beira Interior",
    leadTag:"Leave your contact",
    leadIntro:"Busy day? Leave your details and I'll reach out after the event.",
    fName:"Name",fCompany:"Company",fSite:"Website (optional)",
    send:"Send",
    done:"Thanks. I'll get in touch after the event.",fail:"Couldn't send. Try again or message me on WhatsApp.",
    need:"Fill in name and email",
    qrTitle:"Scan to get my contact",close:"Close"
  },
  pt:{
    role:"Websites e automações de IA para empresas",
    hint:"Toca no cartão para ver os QR",hintBack:"Toca no cartão para voltar",scan:"Lê o código",
    save:"Guardar o meu contacto",
    copy:"Copiar",copied:"Email copiado",
    offerTag:"Para quem conheci no Web Summit",
    offerTitle:"Proposta visual gratuita para o seu site",
    offerText:"Redesenho a página inicial e envio-lha. Sem compromisso. Depois decide se vale a pena avançar.",
    workTag:"Trabalhos recentes",
    w1:"Landing page · comunidade de trading",
    w2:"Website · personal trainer",
    w3:"Websites · Universidade da Beira Interior",
    leadTag:"Deixe o seu contacto",
    leadIntro:"Dia cheio? Deixe os seus dados e entro em contacto depois do evento.",
    fName:"Nome",fCompany:"Empresa",fSite:"Site (opcional)",
    send:"Enviar",
    done:"Obrigado. Entro em contacto depois do evento.",fail:"Não foi possível enviar. Tente de novo ou fale comigo por WhatsApp.",
    need:"Preencha nome e email",
    qrTitle:"Leia para ficar com o meu contacto",close:"Fechar"
  }
};
let lang="en";
function apply(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=T[lang][el.dataset.i]});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;apply();if(window.refreshQR)refreshQR()}));
apply();

const toastEl=document.getElementById("toast");let tt;
function toast(m){toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("on"),2600)}

/* copiar email */
document.getElementById("copy").addEventListener("click",()=>{
  const txt=document.getElementById("mail").textContent;
  const fallback=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("mail"));const s=getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText(txt).then(()=>toast(T[lang].copied),fallback)}catch(e){fallback()}
});

/* formulário */
document.getElementById("lead").addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target;
  if(!f.name.value.trim()||!f.email.value.trim()){toast(T[lang].need);return}
  const btn=f.querySelector(".submit");btn.disabled=true;
  fetch("/api/lead",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nome:f.name.value,email:f.email.value,empresa:f.company.value,servico:"Contacto Web Summit",mensagem:f.site.value?"Site: "+f.site.value:"",origem:"Cartão digital Web Summit",website:f.website.value||""})})
    .then(r=>{if(!r.ok)throw 0;f.hidden=true;document.getElementById("done").hidden=false})
    .catch(()=>{btn.disabled=false;toast(T[lang].fail)});
});

/* cartão: inclinação e luz a seguir o dedo/rato */
const card=document.getElementById("card");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function move(x,y){
  if(document.getElementById("flip").classList.contains("on"))return;
  const r=card.getBoundingClientRect();
  const px=Math.min(Math.max((x-r.left)/r.width,0),1), py=Math.min(Math.max((y-r.top)/r.height,0),1);
  card.style.setProperty("--mx",(px*100)+"%");card.style.setProperty("--my",(py*100)+"%");
  if(!reduce){card.style.setProperty("--ry",((px-.5)*16)+"deg");card.style.setProperty("--rx",((.5-py)*14)+"deg")}
}
function reset(){card.style.setProperty("--rx","0deg");card.style.setProperty("--ry","0deg");card.style.setProperty("--mx","50%");card.style.setProperty("--my","30%")}
card.addEventListener("pointermove",e=>move(e.clientX,e.clientY));
card.addEventListener("pointerleave",reset);
card.addEventListener("touchmove",e=>{const t=e.touches[0];move(t.clientX,t.clientY)},{passive:true});
card.addEventListener("touchend",reset);
/* respiração suave da luz em repouso */
if(!reduce){let t0=performance.now(),idle=true;
  card.addEventListener("pointerenter",()=>idle=false);card.addEventListener("pointerleave",()=>idle=true);
  (function loop(t){if(idle){const a=(t-t0)/2400;card.style.setProperty("--mx",(50+Math.sin(a)*22)+"%");card.style.setProperty("--my",(30+Math.cos(a*.8)*12)+"%")}requestAnimationFrame(loop)})(t0);
}

/* menu de QR codes */
const QRS=[
  {k:"contact",en:"My contact",pt:"O meu contacto",url:"https://starmountainflash.pt/card"},
  {k:"li",en:"My LinkedIn",pt:"O meu LinkedIn",url:"https://www.linkedin.com/in/pedro-silva-pereira-89782a313/"},
  {k:"lic",en:"Company LinkedIn",pt:"LinkedIn da empresa",url:"https://www.linkedin.com/company/starmountain-flash/"},
  {k:"wa",en:"WhatsApp",pt:"WhatsApp",url:"https://wa.me/351937800553"},
  {k:"ig",en:"My Instagram",pt:"O meu Instagram",url:"https://www.instagram.com/pedromsilvape/"},
  {k:"igc",en:"Company Instagram",pt:"Instagram da empresa",url:"https://www.instagram.com/starmountainflash/"},
  {k:"web",en:"Website",pt:"Website",url:"https://starmountainflash.pt"}
];
const tabs=document.getElementById("qr-tabs");let qr=null,cur=0;
function showQR(i){
  cur=i;const q=QRS[i];
  if(window.QRCode){
    if(!qr)qr=new QRCode(document.getElementById("qr"),{text:q.url,width:512,height:512,colorDark:"#090A0A",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
    else{qr.clear();qr.makeCode(q.url)}
  }
  document.getElementById("qr-t").textContent=q[lang];
  document.getElementById("qr-u").textContent=q.url.replace(/^https:\/\/(www\.)?/,"").replace(/\/$/,"");
  tabs.querySelectorAll(".qr-tab").forEach((b,j)=>b.setAttribute("aria-selected",j===i));
}
function buildTabs(){
  tabs.innerHTML="";
  QRS.forEach((q,i)=>{const b=document.createElement("button");b.type="button";b.className="qr-tab";b.id="qrt-"+q.k;b.setAttribute("role","tab");b.textContent=q[lang];b.addEventListener("click",()=>showQR(i));tabs.appendChild(b)});
}
const flip=document.getElementById("flip"),hint=document.getElementById("hint");
function setHint(){hint.textContent=flip.classList.contains("on")?T[lang].hintBack:T[lang].hint}
window.refreshQR=()=>{buildTabs();showQR(cur);setHint()};
function toggleFlip(){
  const on=flip.classList.toggle("on");
  flip.setAttribute("aria-pressed",on);tabs.hidden=!on;
  if(on){reset();showQR(cur)}
  setHint();
}
flip.addEventListener("click",toggleFlip);
flip.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleFlip()}});
buildTabs();showQR(0);setHint();

/* textura de grão */
(function(){const c=document.getElementById("grain"),x=c.getContext("2d");c.width=320;c.height=200;
  const d=x.createImageData(320,200);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
  x.putImageData(d,0,0);c.style.width="100%";c.style.height="100%"})();
</script>
</body>
